name: Xcode Build

on:
  push:
    branches:
      - master
      - 'release/**'
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Plugins/**'
      - 'Tests/**'
      - '.swiftpm/xcode/**'
      - '.github/workflows/xcodebuild.yml'
  pull_request:
    branches:
      - master
      - 'release/**'
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Sources/**'
      - 'Plugins/**'
      - 'Tests/**'
      - '.swiftpm/xcode/**'
      - '.github/workflows/xcodebuild.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-executable:
    name: Build Executable (Xcode ${{ matrix.xcode.version }})
    strategy:
      matrix:
        xcode:
          - version: '26.2'
            runner: macos-26
          - version: latest-stable
            runner: xcode-27
    runs-on: ${{ matrix.xcode.runner }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ matrix.xcode.version }}
      - uses: actions/checkout@v7.0.1
      - name: Build Executable
        run: |
          xcodebuild \
          -scheme swift-package-list \
          -destination 'platform=macOS' \
          build

  build-libraries:
    name: Build Libraries (${{ matrix.destination }}, Xcode ${{ matrix.xcode.version }})
    strategy:
      matrix:
        xcode:
          - version: '26.2'
            runner: macos-26
          - version: latest-stable
            runner: xcode-27
        destination:
          - generic/platform=macOS
          - generic/platform=macOS,variant=Mac Catalyst
          - generic/platform=iOS
          - generic/platform=tvOS
          - generic/platform=watchOS
          - generic/platform=visionOS
    runs-on: ${{ matrix.xcode.runner }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ matrix.xcode.version }}
      - uses: actions/checkout@v7.0.1
      - name: Build SwiftPackageList
        run: |
          xcodebuild \
          -scheme SwiftPackageList \
          -destination '${{ matrix.destination }}'
      - name: Build SwiftPackageListUI
        run: |
          xcodebuild \
          -scheme SwiftPackageListUI \
          -destination '${{ matrix.destination }}'

  test:
    name: Test (Xcode ${{ matrix.xcode.version }})
    needs: [build-executable, build-libraries]
    strategy:
      matrix:
        xcode:
          - version: '26.2'
            runner: macos-26
          - version: latest-stable
            runner: xcode-27
    runs-on: ${{ matrix.xcode.runner }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ matrix.xcode.version }}
      - uses: actions/checkout@v7.0.1
      - name: Install Tuist
        run: brew install tuist
      - name: Run tests
        run: |
          xcodebuild \
          -scheme swift-package-list-Package \
          -destination 'platform=macOS' \
          test
