name: Xcode Build

on:
  push:
    branches:
      - master
      - 'release/**'
    paths-ignore:
      - 'README.md'
      - 'Documentation/**'
  pull_request:
    branches:
      - master
      - 'release/**'
    paths-ignore:
      - 'README.md'
      - 'Documentation/**'
  workflow_dispatch:

jobs:
  build-executable:
    name: Build Executable (Xcode ${{ matrix.xcode.version }})
    strategy:
      matrix:
        xcode:
          - version: '26.0.1'
            runner: macos-26
          - version: latest-stable
            runner: xcode-27
    runs-on: ${{ matrix.xcode.runner }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ matrix.xcode.version }}
      - uses: actions/checkout@v7.0.1
      - name: Build Executable
        run: |
          xcodebuild \
          -scheme swift-package-list \
          -destination 'platform=macOS' \
          build

  build-libraries:
    name: Build ${{ matrix.scheme }} (${{ matrix.destination }}, Xcode ${{ matrix.xcode.version }})
    strategy:
      matrix:
        xcode:
          - version: '26.0.1'
            runner: macos-26
          - version: latest-stable
            runner: xcode-27
        scheme:
          - SwiftPackageList
          - SwiftPackageListUI
        destination:
          - generic/platform=macOS
          - generic/platform=macOS,variant=Mac Catalyst
          - generic/platform=iOS
          - generic/platform=tvOS
          - generic/platform=watchOS
          - generic/platform=visionOS
    runs-on: ${{ matrix.xcode.runner }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ matrix.xcode.version }}
      - uses: actions/checkout@v7.0.1
      - name: Build Scheme
        run: |
          xcodebuild \
          -scheme ${{ matrix.scheme }} \
          -destination '${{ matrix.destination }}'

  test:
    name: Test (Xcode ${{ matrix.xcode.version }})
    needs: [build-executable, build-libraries]
    strategy:
      matrix:
        xcode:
          - version: '26.0.1'
            runner: macos-26
          - version: latest-stable
            runner: xcode-27
    runs-on: ${{ matrix.xcode.runner }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ matrix.xcode.version }}
      - uses: actions/checkout@v7.0.1
      - name: Install Tuist
        run: brew install tuist
      - name: Run tests
        run: |
          xcodebuild \
          -scheme swift-package-list-Package \
          -destination 'platform=macOS' \
          test
