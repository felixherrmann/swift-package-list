name: Release Build

on:
  release:
    types: [published]

jobs:
  release-build:
    name: Release Build
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build executable
        run: |
          swift build \
          --configuration release \
          --product swift-package-list \
          --arch arm64 \
          --arch x86_64
      - name: Generate man page
        run: swift package plugin generate-manual --configuration release
      - name: Archive executable and man page
        run: |
          BIN_PATH=$(swift build \
          --configuration release \
          --arch arm64 \
          --arch x86_64 \
          --show-bin-path)
          tar -c -v -z \
          -f swift-package-list.tar.gz \
          -C "$BIN_PATH" swift-package-list \
          -C "$GITHUB_WORKSPACE/.build/plugins/GenerateManual/outputs/swift-package-list" swift-package-list.1
      - name: Upload archive to release
        run: |
          gh release upload ${{ env.TAG }} swift-package-list.tar.gz
